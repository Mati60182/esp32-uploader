<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 OLED Uploader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 30px; }
        input { background: #333; color: #fff; padding: 12px; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-size: 16px; }
        canvas { border: 2px solid #555; margin-top: 20px; image-rendering: pixelated; width: 256px; height: 128px; background: #000; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Wyslij obraz na ESP32</h2>
    <input type="file" id="upload" accept="image/*"><br>
    <p>Podgląd (128x64):</p>
    <canvas id="canvas" width="128" height="64"></canvas>

    <script>
        document.getElementById('upload').onchange = function(e) {
            if (e.target.files && e.target.files[0]) {
                var reader = new FileReader();
                
                reader.onload = function(event) {
                    var img = new Image();
                    
                    img.onload = function() {
                        var canvas = document.getElementById('canvas');
                        var ctx = canvas.getContext('2d');
                        
                        // Czyszczenie i wypełnienie tła na czarno
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = "black";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Skalowanie z zachowaniem proporcji (pomniejszanie całości)
                        var hRatio = canvas.width / img.width;
                        var vRatio = canvas.height / img.height;
                        var ratio = Math.min(hRatio, vRatio); 
                        
                        var centerShiftX = (canvas.width - img.width * ratio) / 2;
                        var centerShiftY = (canvas.height - img.height * ratio) / 2;
                        
                        ctx.drawImage(img, 0, 0, img.width, img.height, 
                                           centerShiftX, centerShiftY, 
                                           img.width * ratio, img.height * ratio);
                        
                        // Konwersja na czarno-białe (Luminancja)
                        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        var pixels = imgData.data;
                        var buffer = new Uint8Array(1024);
                        
                        for (var i = 0; i < (canvas.width * canvas.height); i++) {
                            var x = i % canvas.width;
                            var y = Math.floor(i / canvas.width);
                            
                            var r = pixels[i * 4];
                            var g = pixels[i * 4 + 1];
                            var b = pixels[i * 4 + 2];
                            
                            var gray = 0.299 * r + 0.587 * g + 0.114 * b;
                            
                            if (gray > 127) {
                                var byteIndex = Math.floor(y / 8) * canvas.width + x;
                                buffer[byteIndex] |= (1 << (y % 8));
                            }
                        }

                        var hexString = Array.from(buffer).map(b => b.toString(16).padStart(2, '0')).join('');

                        // ==========================================
                        // TUTAJ WPISZ LOKALNE IP SWOJEGO ESP32:
                        // ==========================================
                        var esp32ip = "192.168.1.120"; 

                        fetch('http://' + esp32ip + '/update', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'hex=' + hexString
                        }).then(response => {
                            if(response.ok) alert("Wysłano obraz na ekran!");
                            else alert("Błąd wysyłania przez ESP32!");
                        }).catch(err => {
                            alert("Błąd połączenia! Upewnij się, że jesteś w tej samej sieci Wi-Fi.");
                        });
                    };
                    
                    img.onerror = function() {
                        alert("Błąd ładowania obrazka.");
                    };

                    img.src = event.target.result;
                };
                
                reader.readAsDataURL(e.target.files[0]);
            }
        };
    </script>
</body>
</html>
